name: Build check

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + build + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm deps for known CVEs
        working-directory: frontend
        # --omit=dev scopes this to what actually reaches a user. The
        # frontend ships as static assets built into the image, so nothing
        # in node_modules is served at runtime and a dev-tool advisory
        # cannot be exploited against a deployment. Auditing dev deps here
        # only produced permanent red: the ESLint toolchain pulls a
        # vulnerable brace-expansion through minimatch, and the fix is
        # gated on eslint-plugin-jsx-a11y supporting ESLint 10. Pinning an
        # override was tried and breaks ESLint at runtime.
        #
        # Dev advisories are still visible: GitHub's Dependabot alerts
        # report them, and `npm audit` without the flag shows them locally.
        #
        # --audit-level=high filters out low/moderate noise. CVEs at
        # high/critical are actionable signal; tune by overriding the level
        # here when an upstream advisory needs a temporary hold.
        #
        # Retry loop: the npm registry occasionally returns 503 Service
        # Unavailable on the audit endpoint and the job fails through no
        # fault of ours. Three attempts with 30s backoff covers the
        # transient case without masking real CVEs (which the registry
        # returns deterministically).
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "npm audit attempt $attempt failed, retrying in 30s..."
              sleep 30
            fi
          done
          exit 1

      - name: Format check (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + Vite)
        working-directory: frontend
        run: npm run build

      - name: Unit tests (vitest)
        working-directory: frontend
        # `--reporter=junit` emits a JUnit XML alongside the default reporter
        # so the report-publisher job picks it up. `--coverage` emits v8
        # coverage (text + html + lcov) into frontend/coverage/ per the
        # vitest.config.ts coverage block. `|| true` is NOT used — a
        # failing test fails this job and the PR check.
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results.xml --coverage

      - name: Upload frontend test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: frontend-test-results
          path: frontend/test-results.xml
          if-no-files-found: warn

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

  backend:
    name: Backend (syntax check + tests)
    runs-on: ubuntu-latest

    # backend/main.py and backend/database.py both perform module-import-time
    # side effects that demand writable paths: main.py raises if DOWNLOAD_PATH
    # or LIBRARY_PATH is unset, and database.py's init_db() mkdir's the
    # parent of DB_PATH (default /data/ — not writable on a hosted runner).
    # Any step that imports backend.main hits these — pytest, scripts/
    # check_api_docs.py, and any future tooling that walks the FastAPI app.
    # Hoisting to the job env keeps every step covered without per-step
    # duplication.
    #
    # Hardcoded /tmp paths instead of ${{ runner.temp }}: the runner context
    # only populates at step level, so a job-level env that references it
    # parses as empty and the workflow fails to start. Hosted runners give
    # us a writable /tmp; using fixed paths there is the cleanest answer.
    # The conftest fixture's os.environ.setdefault is a no-op when these
    # are already set, so local tests behave identically.
    env:
      DOWNLOAD_PATH: /tmp/curator-ci-downloads
      LIBRARY_PATH: /tmp/curator-ci-library
      DB_PATH: /tmp/curator-ci-dictionary.db

    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # Upgrade pip first so the pip-audit step below doesn't flag the
        # runner's bundled pip itself (e.g. pip 26.1.1 / PYSEC-2026-196,
        # fixed in 26.1.2). The audit runs in env mode and scans every
        # installed package, pip included.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Deps for the optional private domain, installed only when it is
          # checked out. main.py fails loudly when that domain is present but a
          # dependency is not, which is deliberate: the alternative silently
          # 404s every route it owns. With no such file this step is a no-op.
          if [ -f backend/private/requirements.txt ]; then
            pip install -r backend/private/requirements.txt
          fi

      - name: Install test + lint dependencies
        # Mirrors backend/pyproject.toml's [dependency-groups].dev — the
        # subset CI needs for lint + tests + coverage. hypothesis is
        # required by tests/test_properties.py; new dev deps that show
        # up in test files must be added here too.
        run: pip install pytest pytest-asyncio pytest-cov hypothesis "httpx2>=2.5.0" "ruff>=0.8.0"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python deps for known CVEs
        # Env mode — scans every installed package (runtime + dev). Exits
        # non-zero on a published CVE matching a pinned version; use
        # `--ignore-vuln <id>` per advisory if a known-safe one shows up.
        run: pip-audit

      - name: Ruff lint
        run: ruff check backend --config backend/pyproject.toml

      - name: Ruff format check
        run: ruff format --check backend --config backend/pyproject.toml

      - name: Syntax check
        run: python -m compileall -q backend

      - name: Unit tests (pytest)
        # `-c backend/pyproject.toml` points pytest at the [tool.pytest.ini_options]
        # block there; the `testpaths` setting picks up backend/tests/.
        # --cov writes coverage data; --cov-config points pytest-cov at
        # the [tool.coverage.*] blocks in backend/pyproject.toml (needed
        # because pytest-cov looks for coverage config in the cwd, not
        # alongside the pytest -c file). --cov-report=xml emits
        # coverage.xml for the artifact + downstream tools; the `term`
        # reporter prints the per-file table to the CI log so a dipping
        # file is visible without downloading the artifact.
        #
        # The env block at the job level covers DOWNLOAD_PATH / LIBRARY_PATH
        # / DB_PATH for every step that imports backend.main. The mkdir
        # here is just to make sure the dirs exist before any code under
        # test exercises them.
        run: |
          mkdir -p "$DOWNLOAD_PATH" "$LIBRARY_PATH"
          pytest -c backend/pyproject.toml --junitxml=backend-test-results.xml --cov --cov-config=backend/pyproject.toml --cov-report=xml --cov-report=term

      - name: Check API docs in sync
        # Fails when a backend route exists without a matching row under
        # README's `## API Reference`. Same script you can run locally —
        # see .claude/rules/project-workflow.md.
        run: python scripts/check_api_docs.py

      - name: Upload backend test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: backend-test-results
          path: backend-test-results.xml
          if-no-files-found: warn

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks diffs against the merge base on
          # PRs and the previous SHA on direct pushes. Default
          # fetch-depth=1 only sees the tip commit and misses prior
          # leaks.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-test-results:
    name: Publish JUnit reports
    needs: [frontend, backend]
    if: success() || failure()
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend test results
        uses: actions/download-artifact@v8
        if: success() || failure()
        with:
          name: frontend-test-results
          path: frontend-test-results
        continue-on-error: true

      - name: Download backend test results
        uses: actions/download-artifact@v8
        if: success() || failure()
        with:
          name: backend-test-results
          path: backend-test-results
        continue-on-error: true

      - name: Publish JUnit summary
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          include_passed: true
          detailed_summary: true
          # One check_name per report_path. The action pairs the two lists by
          # index and warns when the counts differ, which is what the default
          # single name against two reports was doing. Naming them separately
          # also splits the summary into a frontend and a backend check
          # instead of merging both suites under one heading.
          check_name: |
            Frontend test report
            Backend test report
          report_paths: |
            frontend-test-results/test-results.xml
            backend-test-results/backend-test-results.xml
